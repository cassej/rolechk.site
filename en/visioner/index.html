<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoleChk - Visionary Assessment</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style type="text/tailwindcss">
        @variant dark (&:where(.dark, .dark *));
        @theme {
            --color-brand: #0d9488;
            --color-brand-hover: #0f766e;
            --color-brand-light: #2dd4bf;
            --color-brand-subtle: #ccfbf1;
        }
    </style>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="quiz" class="bg-teal-700 dark:bg-teal-950 text-white font-sans min-h-screen flex flex-col transition-colors duration-300 antialiased">

    <header class="px-6 sm:px-10 h-16 sm:h-18 flex items-center justify-between">
        <a href="/en/" class="flex items-center gap-2 text-white/70 hover:text-white transition-colors no-underline">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span class="text-sm font-medium">Exit</span>
        </a>
        <div class="flex items-center gap-2 text-xs font-medium text-white/50">
            <span id="progress-text"></span>
            <span class="text-white/30">|</span>
            <span id="progress-percent"></span>
        </div>
        <div class="w-20"></div>
    </header>

    <main class="flex-grow flex items-center justify-center px-6 sm:px-10 py-6">

        <div class="w-full max-w-2xl mx-auto text-center">

            <div class="w-full bg-white/10 rounded-full h-1 mb-10 sm:mb-14 overflow-hidden">
                <div id="progress-bar" class="bg-white/80 h-full rounded-full progress-bar" style="width: 5%"></div>
            </div>

            <div class="min-h-[200px] flex items-center justify-center mb-8 sm:mb-10">
                <h2 id="question-text" class="text-2xl sm:text-3xl lg:text-4xl font-medium leading-snug tracking-tight"></h2>
            </div>

            <div id="options-container" class="space-y-3 sm:space-y-4 max-w-lg mx-auto">
            </div>

        </div>

    </main>

    <script>
    window.QUIZ_TEST_ID = 'visioner';
    window.QUIZ_DATA = [
        { text: "My mind constantly generates new concepts and ideas much more actively than most people I know.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "I easily connect disparate facts into a single global system and see trends as a whole.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "Formulating a long-term mission and strategic vector of the organization is my main task.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "I am attracted to finding unconventional solutions for large-scale and complex challenges.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "I take on building strategic partnerships with key figures and counterparties.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "Negotiations on the largest contracts and key agreements are my strong suit.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "My sincere passion for the product and belief in the company energize those around me.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "I am prone to getting excited about promising new projects, abandoning current tasks.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "My focus is always on what will happen tomorrow, not on current or past performance.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "Daily administration, micromanagement, and employee control depress me.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "A high level of uncertainty and justified risk motivate me, not scare me.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "I regularly feel that colleagues move too slowly and don't immediately grasp my train of thought.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "My leadership style is to inspire hearts and motivate, not to monitor discipline.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "I gladly launch new initiatives, but prefer to delegate the routine of seeing them through.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "I am in continuous search of vectors for transformation, modernization, and business growth.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "In decision-making, I rely on developed intuition and react instantly.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "Diving into minor technical details and bureaucratic specifics quickly drains my energy.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "My values and charisma are at the core of our team's corporate culture.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "When analyzing tasks, I first look for the answer to 'Why is this being done?' rather than 'What is the algorithm?'", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] },
        { text: "I sincerely believe in the feasibility of the most ambitious goals, even if a detailed plan is not yet available.", options: [{ text: "Strongly Disagree", score: 1 }, { text: "Disagree", score: 2 }, { text: "Neutral", score: 3 }, { text: "Agree", score: 4 }, { text: "Strongly Agree", score: 5 }] }
    ];
    window.RESULT_DATA = [
        { min: 85, title: "Absolute Visionary", desc: "You are a classic idea generator and ideologist. You live in the future, masterfully create meaning and inspire people, but you vitally need a strong operational partner (Integrator/Executor) who will structure the chaos and bring your ideas to life." },
        { min: 60, title: "Strategic Leader", desc: "You have a well-developed big-picture vision and entrepreneurial instinct, while maintaining a connection to reality. You can successfully guide a company, combining creativity with an understanding of business processes." },
        { min: 40, title: "Pragmatic Manager", desc: "You are more focused on tactics and stability. You can perceive others' innovative ideas and implement them, but independently finding breakthrough solutions is not your main driving force." },
        { min: 0, title: "Stabilizer / Operations Manager", desc: "Your strength lies in structure, order, logic, and 'here and now' processes. You excel at turning chaos into working systems, but tend to avoid risk and uncertainty." }
    ];
    window.QUIZ_Q_OF = 'Question {n} of {max}';
    window.QUIZ_BACK = 'Back';
    </script>
    <script src="/js/quiz.js" defer></script>
</body>
</html>
