<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoleChk - Professional Self-Assessments</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @variant dark (&:where(.dark, .dark *));
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans min-h-screen flex flex-col transition-colors duration-200">

    <header class="w-full bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700 transition-colors duration-200">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <a href="#" class="font-bold tracking-tight text-indigo-600 dark:text-indigo-400 text-lg" id="logo-link">RoleChk</a>
                <nav class="hidden sm:flex items-center gap-4 text-sm font-medium">
                    <a href="#" data-screen="home" class="nav-link active text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">Tests</a>
                    <a href="#" data-screen="blog" class="nav-link text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">Blog</a>
                </nav>
            </div>
            <div class="flex items-center gap-2">
                <select id="lang-select" class="h-9 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-2 text-xs font-semibold cursor-pointer focus:outline-none text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600/70 transition">
                    <option value="en">EN</option>
                    <option value="es">ES</option>
                    <option value="zh">ZH</option>
                </select>
                <button id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-400 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600/70 transition">
                    <svg id="sun-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14.5 12a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path></svg>
                    <svg id="moon-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>
        <nav class="sm:hidden flex items-center justify-center gap-6 pb-3 text-sm font-medium">
            <a href="#" data-screen="home" class="nav-link active text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">Tests</a>
            <a href="#" data-screen="blog" class="nav-link text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">Blog</a>
        </nav>
    </header>

    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow flex flex-col">

        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 p-4 sm:p-8 transition-colors duration-200 min-h-[500px]">

            <div id="screen-home" class="screen active fade-in">
                <div class="text-center mb-8">
                    <h1 id="home-title" class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white"></h1>
                    <p id="home-subtitle" class="text-slate-600 dark:text-slate-400 mt-2 text-sm sm:text-base"></p>
                </div>
                <div id="test-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                </div>
            </div>

            <div id="screen-quiz" class="screen fade-in">
                <div id="quiz-view" class="space-y-6 flex-grow flex flex-col">
                    <div>
                        <div class="flex justify-between items-center text-xs font-bold text-slate-400 dark:text-slate-500 mb-2">
                            <span id="progress-text"></span>
                            <span id="progress-percent"></span>
                        </div>
                        <div class="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                            <div id="progress-bar" class="bg-indigo-600 dark:bg-indigo-500 h-full transition-all duration-200"></div>
                        </div>
                    </div>

                    <div class="my-auto py-2">
                        <h2 id="question-text" class="text-base sm:text-xl font-semibold text-slate-900 dark:text-white leading-snug"></h2>
                    </div>

                    <div id="options-container" class="space-y-3 w-full">
                    </div>
                </div>
                <div id="result-view" class="hidden fade-in space-y-6">
                    <div class="text-center space-y-4">
                        <h2 id="meta-res-title" class="text-xs uppercase tracking-wider font-bold text-slate-400 dark:text-slate-500"></h2>
                        <div class="text-4xl sm:text-5xl font-extrabold text-slate-900 dark:text-white" id="score-display">0 / 100</div>
                        <h3 class="text-lg sm:text-xl font-bold text-indigo-600 dark:text-indigo-400" id="status-title"></h3>
                        <p id="status-desc" class="text-slate-600 dark:text-slate-400 text-sm sm:text-base leading-relaxed"></p>
                    </div>

                    <div class="pt-6 border-t border-slate-100 dark:border-slate-700/60">
                        <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-3 text-center">Share your result</p>
                        <div class="flex flex-wrap justify-center gap-2 sm:gap-3" id="social-share-buttons">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100 dark:border-slate-700/60">
                        <button id="back-to-tests-btn" class="w-full bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white text-white dark:text-slate-900 font-semibold py-3 px-6 rounded-xl transition cursor-pointer text-sm sm:text-base shadow-md">
                            Back to Tests
                        </button>
                    </div>
                </div>
            </div>

            <div id="screen-blog" class="screen fade-in">
                <h2 id="blog-title" class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-6"></h2>
                <div id="blog-list" class="space-y-4 sm:space-y-6">
                </div>
            </div>

            <div id="screen-article" class="screen fade-in">
                <button id="back-to-blog-btn" class="text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:underline mb-4 cursor-pointer">&larr; Back to Blog</button>
                <div id="article-content" class="prose prose-sm sm:prose-base dark:prose-invert max-w-none">
                </div>
            </div>

            <div id="screen-cookie" class="screen fade-in">
                <h2 id="cookie-title" class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-6"></h2>
                <div id="cookie-content" class="prose prose-sm sm:prose-base dark:prose-invert max-w-none">
                </div>
            </div>

        </div>
    </main>

    <footer class="w-full max-w-4xl mx-auto px-4 sm:px-6 pb-6 pt-4 text-center flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4">
        <p id="disclaimer-text" class="text-[11px] sm:text-xs leading-relaxed text-slate-400 dark:text-slate-500 transition-colors"></p>
        <a href="#" data-screen="cookie" class="nav-link text-[11px] sm:text-xs text-slate-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 underline whitespace-nowrap">Cookie Policy</a>
    </footer>

    <div id="cookie-banner" class="cookie-banner fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 shadow-lg p-4 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <p id="cookie-banner-text" class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 text-center sm:text-left"></p>
            <button id="cookie-accept-btn" class="shrink-0 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white text-xs font-semibold px-5 py-2 rounded-xl transition cursor-pointer whitespace-nowrap"></button>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
