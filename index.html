<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoleChk</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style type="text/tailwindcss">
        @variant dark (&:where(.dark, .dark *));
        @theme {
            --color-brand: #0d9488;
            --color-brand-hover: #0f766e;
            --color-brand-light: #2dd4bf;
            --color-brand-subtle: #ccfbf1;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home" class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-50 font-sans min-h-screen flex flex-col transition-colors duration-300 antialiased">

    <header class="bg-white/80 dark:bg-stone-900/80 backdrop-blur-md border-b border-stone-200/40 dark:border-stone-800/40">
        <div class="px-6 sm:px-10 h-16 sm:h-18 flex items-center justify-between max-w-none">
            <a href="/" class="flex items-center gap-2.5 font-semibold text-stone-900 dark:text-stone-50 no-underline">
                <i data-lucide="target" class="w-5 h-5 text-brand dark:text-brand-light"></i>
                <span class="text-lg tracking-tight">RoleChk</span>
            </a>
            <nav class="hidden sm:flex items-center gap-1">
                <a href="/" class="px-4 py-2 text-sm font-medium rounded-xl text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-50 hover:bg-stone-100 dark:hover:bg-stone-800 transition-all">Journal</a>
                <a href="/visioner/" class="px-4 py-2 text-sm font-medium rounded-xl text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-50 hover:bg-stone-100 dark:hover:bg-stone-800 transition-all">Visionary</a>
                <a href="/integrator/" class="px-4 py-2 text-sm font-medium rounded-xl text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-50 hover:bg-stone-100 dark:hover:bg-stone-800 transition-all">Integrator</a>
            </nav>
            <div class="flex items-center gap-1.5">
                <div class="relative">
                    <select id="lang-select" class="appearance-none h-9 pl-3 pr-8 bg-transparent border border-stone-200 dark:border-stone-700 rounded-xl text-xs font-medium text-stone-600 dark:text-stone-400 cursor-pointer focus:outline-none focus:border-brand dark:focus:border-brand-light transition-colors">
                        <option value="en">EN</option>
                        <option value="es">ES</option>
                        <option value="zh">ZH</option>
                    </select>
                    <i data-lucide="globe" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-stone-400 pointer-events-none"></i>
                </div>
                <button id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-xl text-stone-500 dark:text-stone-400 hover:bg-stone-100 dark:hover:bg-stone-800 cursor-pointer transition-all border border-transparent hover:border-stone-200 dark:hover:border-stone-700">
                    <i data-lucide="sun" id="sun-icon" class="w-4 h-4 hidden"></i>
                    <i data-lucide="moon" id="moon-icon" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
        <nav class="sm:hidden flex items-center justify-center gap-6 pb-3.5">
            <a href="/" class="text-xs font-medium text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-50 transition-colors">Journal</a>
            <a href="/visioner/" class="text-xs font-medium text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-50 transition-colors">Visionary</a>
            <a href="/integrator/" class="text-xs font-medium text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-50 transition-colors">Integrator</a>
        </nav>
    </header>

    <main class="flex-grow px-6 sm:px-10 py-10 sm:py-14">

        <div class="max-w-7xl mx-auto">

            <div class="mb-12 sm:mb-16">
                <div class="flex items-center gap-3 mb-10 sm:mb-14">
                    <div class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-brand-subtle dark:bg-stone-800">
                        <i data-lucide="book-open" class="w-5 h-5 text-brand dark:text-brand-light"></i>
                    </div>
                    <h2 id="blog-title" class="text-2xl sm:text-3xl lg:text-4xl font-semibold tracking-tight text-stone-900 dark:text-stone-50"></h2>
                </div>

                <div id="blog-list" class="max-w-2xl">
                </div>
            </div>

            <div class="border-t border-stone-200/40 dark:border-stone-800/40 pt-12 sm:pt-16">
                <div class="text-center max-w-2xl mx-auto mb-10 sm:mb-12">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-brand-subtle dark:bg-stone-800 mb-4">
                        <i data-lucide="target" class="w-6 h-6 text-brand dark:text-brand-light"></i>
                    </div>
                    <h2 id="home-title" class="text-2xl sm:text-3xl lg:text-4xl font-semibold tracking-tight text-stone-900 dark:text-stone-50 leading-tight"></h2>
                    <p id="home-subtitle" class="text-sm sm:text-base text-stone-500 dark:text-stone-400 mt-3 leading-relaxed max-w-lg mx-auto"></p>
                </div>

                <div id="test-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6 max-w-4xl mx-auto">
                </div>
            </div>

        </div>

    </main>

    <footer class="px-6 sm:px-10 pb-6 sm:pb-8 pt-2">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4">
            <p id="disclaimer-text" class="text-[11px] leading-relaxed text-stone-400 dark:text-stone-500 text-center"></p>
            <a href="/cookie.html" class="text-[11px] text-stone-400 dark:text-stone-500 hover:text-brand dark:hover:text-brand-light underline decoration-stone-300 dark:decoration-stone-700 underline-offset-2 whitespace-nowrap transition-colors">Cookie Policy</a>
        </div>
    </footer>

    <div id="cookie-banner" class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-stone-900/90 backdrop-blur-md border-t border-stone-200/40 dark:border-stone-800/40 p-4 sm:p-5 z-50 hidden">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-6">
            <p id="cookie-banner-text" class="text-xs sm:text-sm text-stone-500 dark:text-stone-400 text-center sm:text-left leading-relaxed"></p>
            <div class="flex items-center gap-2 shrink-0">
                <button id="cookie-reject-btn" class="flex items-center gap-1.5 bg-stone-200 dark:bg-stone-700 hover:bg-stone-300 dark:hover:bg-stone-600 text-stone-700 dark:text-stone-300 text-xs font-semibold px-5 py-2.5 rounded-xl transition-all cursor-pointer whitespace-nowrap"></button>
                <button id="cookie-accept-btn" class="flex items-center gap-1.5 bg-brand hover:bg-brand-hover dark:bg-brand-light dark:hover:bg-brand text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition-all cursor-pointer whitespace-nowrap"></button>
            </div>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
