<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Role Test | RoleChk</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @variant dark (&:where(.dark, .dark *));
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans min-h-screen flex flex-col justify-between transition-colors duration-200">

    <header class="w-full bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700 transition-colors duration-200">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="font-bold tracking-tight text-indigo-600 dark:text-indigo-400 text-lg">
                RoleChk<span class="text-slate-400 dark:text-slate-500 font-normal text-xs">.site</span>
            </div>
            <div class="flex items-center gap-2">
                <select id="lang-select" class="h-9 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 text-xs font-semibold cursor-pointer focus:outline-none text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600/70 transition flex items-center">
                    <option value="en">🇺🇸 English</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="zh">🇨🇳 中文</option>
                </select>

                <button id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-400 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600/70 transition">
                    <svg id="sun-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14.5 12a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path></svg>
                    <svg id="moon-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto px-4 py-6 flex-grow flex flex-col justify-center">

        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 p-6 sm:p-8 min-h-[440px] flex flex-col justify-between transition-colors duration-200">

            <div id="start-screen" class="space-y-6 text-center my-auto">
                <div class="inline-flex p-3 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 rounded-xl font-bold text-2xl">⚡</div>
                <h1 id="meta-title" class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white"></h1>
                <p id="meta-desc" class="text-slate-600 dark:text-slate-400 leading-relaxed text-sm sm:text-base px-2"></p>
                <div class="max-w-xs mx-auto">
                    <div id="meta-info" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50/50 dark:bg-indigo-950/20 py-2.5 rounded-xl"></div>
                </div>
                <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md transition cursor-pointer text-sm sm:text-base">
                </button>
            </div>

            <div id="quiz-screen" class="hidden space-y-6 flex-grow flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center text-xs font-bold text-slate-400 dark:text-slate-500 mb-2">
                        <span id="progress-text"></span>
                        <span id="progress-percent"></span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-indigo-600 dark:bg-indigo-500 h-full transition-all duration-200"></div>
                    </div>
                </div>

                <div class="my-auto py-2">
                    <h2 id="question-text" class="text-lg sm:text-xl font-semibold text-slate-900 dark:text-white leading-snug"></h2>
                </div>

                <div id="options-container" class="space-y-3 w-full">
                </div>
            </div>

            <div id="result-screen" class="hidden text-center space-y-6">
                <div class="inline-flex p-3 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 rounded-xl font-bold text-2xl">🎯</div>
                <h2 id="meta-res-title" class="text-xs uppercase tracking-wider font-bold text-slate-400 dark:text-slate-500"></h2>

                <div class="text-5xl font-extrabold text-slate-900 dark:text-white" id="score-display">0 / 100</div>
                <h3 class="text-xl font-bold text-indigo-600 dark:text-indigo-400" id="status-title"></h3>

                <p id="status-desc" class="text-slate-600 dark:text-slate-400 text-sm sm:text-base leading-relaxed px-2"></p>

                <div class="w-full bg-slate-50 dark:bg-slate-900/40 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl p-4 my-4 flex justify-center items-center text-xs text-slate-400 dark:text-slate-500 min-h-[250px]">
                    [ Premium Square Ad Banner (300x250) ]
                </div>

                <div class="pt-2 border-t border-slate-100 dark:border-slate-700/60 space-y-3">
                    <button id="share-btn" class="w-full bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white text-white dark:text-slate-900 font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 transition cursor-pointer text-sm sm:text-base shadow-md"></button>
                </div>
            </div>

        </div>
    </main>

    <footer class="w-full max-w-xl mx-auto px-6 pb-6 text-center">
        <p id="disclaimer-text" class="text-[11px] sm:text-xs leading-relaxed text-slate-400 dark:text-slate-500 transition-colors"></p>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
